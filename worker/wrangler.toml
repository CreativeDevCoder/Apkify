name = "apkify-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Pasang di domain yang sama dengan Pages agar tanpa CORS & Cache API aktif
# (Cache API tidak berfungsi di *.workers.dev):
# routes = [{ pattern = "apkify.domainanda.com/api/*", zone_name = "domainanda.com" }]

[vars]
APP_NAME = "Apkify"
APP_ORIGIN = "https://apkify.pages.dev"          # origin frontend (CORS + link di email)
FIREBASE_PROJECT_ID = "your-project"
FIREBASE_DB_URL = "https://your-project-default-rtdb.asia-southeast1.firebasedatabase.app"
GITHUB_BUILDER_REPO = "CreativeDevCoder/Apkify"   # repo ini (workflow di .github/workflows)
GITHUB_BUILDER_WORKFLOW = "build-apk.yml"
GITHUB_BUILDER_REF = "main"
EMAIL_FROM = "noreply@domainanda.com"
EMAIL_FROM_NAME = "Apkify"
DEFAULT_DAILY_BUILD_LIMIT = "10"
MAX_UPLOAD_MB = "50"
ADMIN_EMAIL = ""                                  # tujuan pesan formulir Kontak
AI_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"           # model Workers AI untuk AI Studio

# Workers AI untuk AI Studio (jatah gratis harian)
[ai]
binding = "AI"

# Penyedia #1 penyimpanan: Cloudflare R2 (binding, tanpa egress fee)
[[r2_buckets]]
binding = "R2"
bucket_name = "apkify-files"

# Rahasia (jalankan: wrangler secret put NAMA):
# FIREBASE_SA_EMAIL, FIREBASE_SA_PRIVATE_KEY, BUILDER_SECRET, KEYSTORE_ENC_KEY, GITHUB_TOKEN
# Email : BREVO_API_KEY, RESEND_API_KEY, MAILJET_API_KEY, MAILJET_API_SECRET, MAILGUN_API_KEY, MAILGUN_DOMAIN,
#         MAILGUN_REGION, POSTMARK_TOKEN, SMTP2GO_API_KEY, MAILERSEND_API_KEY, ELASTICEMAIL_API_KEY,
#         MAILTRAP_API_TOKEN, SENDPULSE_CLIENT_ID, SENDPULSE_CLIENT_SECRET
# Drive : B2_KEY_ID, B2_APP_KEY, B2_BUCKET, B2_ENDPOINT, GDRIVE_CLIENT_ID, GDRIVE_CLIENT_SECRET,
#         GDRIVE_REFRESH_TOKEN, GDRIVE_FOLDER_ID, DROPBOX_APP_KEY, DROPBOX_APP_SECRET, DROPBOX_REFRESH_TOKEN,
#         ONEDRIVE_CLIENT_ID, ONEDRIVE_CLIENT_SECRET, ONEDRIVE_REFRESH_TOKEN, BOX_CLIENT_ID, BOX_CLIENT_SECRET,
#         BOX_USER_ID, BOX_FOLDER_ID, PCLOUD_TOKEN, PCLOUD_API_HOST, PCLOUD_FOLDER_ID, SUPABASE_URL,
#         SUPABASE_SERVICE_KEY, SUPABASE_BUCKET, GHSTORE_TOKEN, GHSTORE_REPO, KOOFR_EMAIL, KOOFR_APP_PASSWORD

# Cron: tandai build macet sebagai gagal (gratis, maks 5 cron per akun)
[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true
