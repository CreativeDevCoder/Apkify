[package]
name = "apkify-desktop"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
regex = "1"

# Ukuran kecil: aplikasi desktop Tauri ~3-10 MB (vs Electron 80+ MB)
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
